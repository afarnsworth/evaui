# Publishes the NERV Life Support tracker to GitHub Pages as an installable app.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy tracker to Pages

on:
  push:
    paths:
      - tracker/**
      - scripts/build-tracker.mjs
      - scripts/make-icons.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The github-pages environment only accepts the default branch, so pushes
    # elsewhere are skipped rather than failing.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Node ships with the runner image; the build is one dependency-free script.
      - name: Build installable app
        run: |
          node scripts/build-tracker.mjs
          mkdir -p _site
          cp -r tracker/index.html tracker/manifest.webmanifest tracker/sw.js tracker/icons _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
