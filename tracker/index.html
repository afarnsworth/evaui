<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030504">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>NERV Life Support</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@900&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
/* Layout: two NERV battery panels facing each other across a MAGI console strip.
   The far panel is rotated 180° so each player reads their own total. */
:root {
  /* Single deliberate dark look: a NERV terminal. */
  --bg: #030504;
  --panel: #070a08;
  --grid: rgba(70, 255, 138, 0.05);
  --green: #46ff8a;
  --green-dim: #1b7a45;
  --plate-hi: #7ef06a;
  --plate-lo: #2fb150;
  --orange: #ff8c1a;
  --amber: #ffa91f;
  --amber-off: #1a1004;
  --red: #ff2b1c;
  --red-deep: #9e0c12;
  --ink: #000000;
  --paper: #f4f1ea;

  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-label: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;

  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--orange);
  font-family: var(--font-label);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* CRT finish over everything */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background:
    radial-gradient(ellipse 80% 75% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.55) 100%),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px);
}

#app {
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px;
  margin-inline: auto;
}

/* ---------- player panel ---------- */
.player {
  --frame: var(--orange);
  --digit: var(--amber);
  position: relative;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  min-height: 0;
  border: 2px solid var(--frame);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--panel);
  box-shadow: 0 0 16px color-mix(in srgb, var(--frame) 30%, transparent), inset 0 0 50px var(--ink);
  overflow: hidden;
  animation: power-on 0.45s steps(1) both;
}
.player[data-p="1"] { transform: rotate(180deg); animation-delay: 0.08s; }
.player[data-p="0"] { --accent: var(--green); }
.player[data-p="1"] { --accent: var(--orange); }

.player.warn { --frame: var(--red); --digit: var(--red); }
.player.dead { --frame: var(--red); --digit: var(--red); }

@keyframes power-on {
  0% { opacity: 0; }
  15% { opacity: 1; }
  30% { opacity: 0.15; }
  45% { opacity: 1; }
  60% { opacity: 0.3; }
  75%, 100% { opacity: 1; }
}

.ph {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 6px;
  border-bottom: 1px solid color-mix(in srgb, var(--frame) 45%, transparent);
  min-width: 0;
}
.tag {
  flex: none;
  background: var(--accent);
  color: var(--ink);
  font-family: var(--font-jp);
  font-weight: 900;
  font-size: clamp(13px, 3.6vw, 18px);
  line-height: 1;
  padding: 5px 8px;
}
.unit {
  flex: none;
  color: var(--accent);
  font-weight: 700;
  font-size: clamp(12px, 3.2vw, 16px);
  letter-spacing: 0.12em;
}
.name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px dashed color-mix(in srgb, var(--orange) 40%, transparent);
  color: var(--orange);
  font: 700 clamp(14px, 3.8vw, 20px) / 1.1 var(--font-label);
  letter-spacing: 0.08em;
  padding: 2px 0;
  cursor: text;
}
.name-input {
  flex: 1;
  min-width: 0;
  background: var(--ink);
  border: 1px solid var(--orange);
  color: var(--orange);
  font: 700 clamp(14px, 3.8vw, 20px) / 1.1 var(--font-label);
  letter-spacing: 0.08em;
  padding: 2px 6px;
  text-transform: uppercase;
  -webkit-user-select: text;
  user-select: text;
}
.status {
  flex: none;
  display: flex;
  align-items: baseline;
  gap: 6px;
  color: var(--green);
  font-size: clamp(11px, 3vw, 14px);
  font-weight: 700;
  letter-spacing: 0.12em;
}
.status b { font-family: var(--font-jp); font-weight: 900; letter-spacing: 0; }
.player.warn .status, .player.dead .status { color: var(--red); }
.player.warn .status { animation: blink 0.9s steps(1) infinite; }

.hazard {
  height: 0;
  background: repeating-linear-gradient(-45deg, var(--red) 0 9px, var(--ink) 9px 18px);
  transition: height 0.15s;
}
.player.warn .hazard, .player.dead .hazard { height: 8px; animation: hazard-scroll 1s linear infinite; }
@keyframes hazard-scroll { to { background-position: 25px 0; } }

/* ---------- tap zones + readout ---------- */
.body { position: relative; min-height: 0; }

.zone {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  display: flex;
  align-items: center;
}
.zone.minus { left: 0; justify-content: flex-start; padding-left: 8px; }
.zone.plus { right: 0; justify-content: flex-end; padding-right: 8px; }
.zone:focus-visible { outline: 2px solid var(--paper); outline-offset: -4px; }
.flash {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}
.minus .flash { background: linear-gradient(90deg, color-mix(in srgb, var(--red) 35%, transparent), transparent 85%); }
.plus .flash { background: linear-gradient(270deg, color-mix(in srgb, var(--green) 30%, transparent), transparent 85%); }

/* Eva mode-button plate: green plate, black well, orange glyph */
.plate {
  position: relative;
  width: clamp(40px, 11vw, 62px);
  height: min(58%, 150px);
  padding: 5px;
  background: linear-gradient(180deg, var(--plate-hi), var(--plate-lo));
  box-shadow: 0 0 18px color-mix(in srgb, var(--green) 25%, transparent);
}
.plate span {
  display: grid;
  place-items: center;
  height: 100%;
  background: var(--ink);
  border: 2px solid var(--orange);
  color: var(--orange);
  font: 700 clamp(28px, 8vw, 44px) / 1 var(--font-label);
  text-shadow: 0 0 8px var(--orange);
}
.minus .plate span { color: var(--red); text-shadow: 0 0 8px var(--red); }

.readout {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  padding: 10px clamp(56px, 16vw, 92px) 6px;
  gap: 4px;
}
.label-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
}
.limit {
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.limit b {
  font-family: var(--font-jp);
  font-weight: 900;
  font-size: clamp(11px, 3vw, 15px);
  border: 2px solid var(--orange);
  padding: 2px 6px;
  text-shadow: 0 0 6px color-mix(in srgb, var(--orange) 60%, transparent);
}
.limit small {
  font-size: clamp(10px, 2.6vw, 13px);
  font-weight: 600;
  letter-spacing: 0.1em;
}
.delta {
  font: 700 clamp(22px, 6.5vw, 36px) / 1 var(--font-label);
  letter-spacing: 0.04em;
  opacity: 0;
  transition: opacity 0.2s;
}
.delta.show { opacity: 1; }
.delta.up { color: var(--green); text-shadow: 0 0 10px var(--green); }
.delta.down { color: var(--red); text-shadow: 0 0 10px var(--red); }

.digits { flex: 1; min-height: 0; display: grid; place-items: center; }
.digits svg { width: 100%; height: 100%; display: block; overflow: visible; }
.digits .on { fill: var(--digit); }
.digits .off { fill: var(--amber-off); }
.player.warn .digits .on { animation: blink 1.1s steps(1) infinite; }

/* ---------- gauge ---------- */
.gauge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px 9px;
  border-top: 1px solid color-mix(in srgb, var(--frame) 45%, transparent);
}
.gauge .lbl {
  flex: none;
  font-size: clamp(10px, 2.6vw, 13px);
  font-weight: 700;
  letter-spacing: 0.12em;
  white-space: nowrap;
}
.gauge .lbl b { font-family: var(--font-jp); font-weight: 900; letter-spacing: 0; margin-right: 6px; }
.cells { flex: 1; display: flex; gap: 3px; height: 12px; min-width: 0; }
.cells i {
  flex: 1;
  transform: skewX(-20deg);
  background: var(--amber-off);
  border: 1px solid color-mix(in srgb, var(--orange) 25%, transparent);
}
.cells i.lit { background: var(--cell); border-color: var(--cell); box-shadow: 0 0 6px var(--cell); }
.pct {
  flex: none;
  width: 4.2ch;
  text-align: right;
  font-weight: 700;
  font-size: clamp(12px, 3.2vw, 16px);
  font-variant-numeric: tabular-nums;
}

/* ---------- stamps ---------- */
.stamp {
  position: absolute;
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  z-index: 5;
  pointer-events: none;
  background: var(--stamp, var(--orange));
  color: var(--ink);
  border: 4px solid var(--stamp, var(--orange));
  box-shadow: 0 0 40px var(--stamp, var(--orange));
  padding: 10px 26px 12px;
  text-align: center;
  white-space: nowrap;
  line-height: 1;
}
.stamp b {
  display: block;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 13vw, 84px);
  transform: scale(0.88, 1.15);
}
.stamp small {
  display: block;
  margin-top: 8px;
  font: 700 clamp(12px, 3.4vw, 18px) / 1 var(--font-label);
  letter-spacing: 0.3em;
}
.stamp.dead { --stamp: var(--red); }
.stamp.first { --stamp: var(--green); }
.stamp.slam { animation: slam 0.35s ease-out both; }
@keyframes slam {
  0% { scale: 1.35; opacity: 0; }
  20% { opacity: 1; background: var(--ink); color: var(--stamp, var(--orange)); }
  40% { background: var(--stamp, var(--orange)); color: var(--ink); }
  60% { background: var(--ink); color: var(--stamp, var(--orange)); }
  100% { scale: 1; }
}

/* ---------- console ---------- */
.console {
  display: flex;
  align-items: stretch;
  gap: 6px;
  min-height: 56px;
  animation: power-on 0.45s steps(1) 0.16s both;
}
.magi {
  flex: none;
  display: grid;
  place-items: center;
  width: 56px;
  background: var(--orange);
  color: var(--ink);
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  font: 700 15px / 1 var(--font-label);
  letter-spacing: 0.08em;
}
.cbtn {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: var(--ink);
  border: 2px solid var(--orange);
  color: var(--orange);
  cursor: pointer;
  padding: 4px 2px;
  touch-action: manipulation;
}
.cbtn b { font-family: var(--font-jp); font-weight: 900; font-size: clamp(12px, 3.4vw, 16px); line-height: 1; }
.cbtn small { font: 700 clamp(10px, 2.6vw, 12px) / 1 var(--font-label); letter-spacing: 0.12em; }
.cbtn:active { background: var(--orange); color: var(--ink); }
.cbtn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.cbtn:disabled { opacity: 0.35; cursor: default; }
.cbtn.on { color: var(--green); border-color: var(--green); }
.cbtn.go { background: var(--orange); color: var(--ink); }
.cbtn.go:active { background: var(--ink); color: var(--orange); }

.console-label {
  flex: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  padding-inline: 4px 2px;
  white-space: nowrap;
}
.console-label b { font-family: var(--font-jp); font-weight: 900; font-size: 15px; line-height: 1; }
.console-label small { font: 700 11px / 1 var(--font-label); letter-spacing: 0.12em; }

.vote {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 2px solid var(--orange);
  background: var(--ink);
  color: var(--orange);
  text-align: center;
}
.vote small { font: 700 clamp(9px, 2.5vw, 12px) / 1 var(--font-label); letter-spacing: 0.08em; }
.vote b { font-family: var(--font-jp); font-weight: 900; font-size: clamp(12px, 3.4vw, 15px); line-height: 1; }
.vote.pending b { animation: blink 0.5s steps(1) infinite; }
.vote.p0 { background: var(--green); border-color: var(--green); color: var(--ink); }
.vote.p1 { background: var(--orange); color: var(--ink); }

@keyframes blink { 50% { opacity: 0.25; } }

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 370px) {
  .magi { display: none; }
  .unit { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<!-- Shared bloom filter for every seven-segment readout -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>

<main id="app">
  <section class="player" data-p="1" aria-label="Player 2"></section>
  <nav class="console" id="console" aria-label="Game controls"></nav>
  <section class="player" data-p="0" aria-label="Player 1"></section>
</main>

<script>
(() => {
  // ---------------------------------------------------------------- state --
  const UNITS = [
    {tag: '零号機', unit: 'UNIT-00'},
    {tag: '初号機', unit: 'UNIT-01'},
  ];
  const KEY = 'nerv-life-support-v1';
  const WARN_AT = 5;

  const fresh = (start = 20, names = ['PLAYER 1', 'PLAYER 2'], sound = true) => ({
    start,
    life: [start, start],
    names,
    sound,
    history: [],
  });

  let state = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Array.isArray(saved.life)) state = {...fresh(), ...saved};
  } catch (e) { /* storage unavailable: start fresh */ }

  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  };

  // Taps within a short window on one player fold into a single change:
  // one delta readout, one undo step.
  const pending = [null, null];
  const WINDOW_MS = 1600;

  // ---------------------------------------------------------- seven-seg --
  const SEGS = {
    '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc',
    '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '',
  };
  const W = 100, H = 190, T = 20, G = 3, SP = 0.3, SKEW = -8;
  const hSeg = (x0, x1, y) => `${x0},${y} ${x0 + T / 2},${y - T / 2} ${x1 - T / 2},${y - T / 2} ${x1},${y} ${x1 - T / 2},${y + T / 2} ${x0 + T / 2},${y + T / 2}`;
  const vSeg = (x, y0, y1) => `${x},${y0} ${x + T / 2},${y0 + T / 2} ${x + T / 2},${y1 - T / 2} ${x},${y1} ${x - T / 2},${y1 - T / 2} ${x - T / 2},${y0 + T / 2}`;
  const M = H / 2;
  const POLY = {
    a: hSeg(T / 2 + G, W - T / 2 - G, T / 2),
    b: vSeg(W - T / 2, T / 2 + G, M - G),
    c: vSeg(W - T / 2, M + G, H - T / 2 - G),
    d: hSeg(T / 2 + G, W - T / 2 - G, H - T / 2),
    e: vSeg(T / 2, M + G, H - T / 2 - G),
    f: vSeg(T / 2, T / 2 + G, M - G),
    g: hSeg(T / 2 + G, W - T / 2 - G, M),
  };
  const sevenSeg = (text) => {
    let on = '', off = '', x = 0;
    for (const ch of text) {
      const lit = SEGS[ch] ?? '';
      for (const k of 'abcdefg') {
        const p = `<polygon transform="translate(${x} 0)" points="${POLY[k]}"/>`;
        if (lit.includes(k)) on += p; else off += p;
      }
      x += W * (1 + SP);
    }
    const total = x - W * SP;
    const pad = Math.tan((-SKEW * Math.PI) / 180) * H;
    return `<svg viewBox="-6 -6 ${total + pad + 12} ${H + 12}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">` +
      `<g transform="skewX(${SKEW}) translate(${pad} 0)"><g class="off">${off}</g><g class="on" filter="url(#bloom)">${on}</g></g></svg>`;
  };
  const lifeText = (n) => {
    const s = String(n);
    return s.length < 2 ? ' ' + s : s;
  };

  // --------------------------------------------------------------- sound --
  const Snd = (() => {
    let ctx = null, master = null;
    const ensure = () => {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.22;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    };
    const tone = (f, t0, dur, {type = 'square', gain = 0.4, to = null, lp = 6000} = {}) => {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      const flt = ctx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.value = lp;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(flt).connect(g).connect(master);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    };
    const NOTES = [1320, 1760, 1980, 2640, 2960, 3520];
    const play = (name) => {
      if (!state.sound) return;
      const c = ensure();
      if (!c) return;
      const t = c.currentTime + 0.005;
      switch (name) {
        case 'plus': tone(2200, t, 0.07, {gain: 0.3}); break;
        case 'minus': tone(1100, t, 0.08, {gain: 0.35}); break;
        case 'warn': for (let i = 0; i < 3; i++) tone(960, t + i * 0.25, 0.17, {gain: 0.35, to: 900, lp: 4000}); break;
        case 'zero':
          tone(160, t, 0.7, {type: 'sine', to: 45, gain: 0.9, lp: 900});
          [[660, 0.28, 0.9], [1822, 0.16, 0.6], [3564, 0.07, 0.35]].forEach(([f, g, d]) => tone(f, t, d, {type: 'sine', gain: g}));
          break;
        case 'reset':
          tone(90, t, 0.14, {type: 'sine', to: 55, gain: 0.6, lp: 500});
          tone(300, t, 0.28, {type: 'sine', to: 2400, gain: 0.25});
          break;
        case 'chatter':
          for (let i = 0; i < 40; i++) if (Math.random() < 0.7) tone(NOTES[Math.floor(Math.random() * NOTES.length)], t + i * 0.03, 0.028, {gain: 0.14});
          break;
        case 'approve': tone(880, t, 0.09, {gain: 0.28}); tone(1320, t + 0.11, 0.19, {gain: 0.28}); break;
        case 'undo': tone(1320, t, 0.05, {gain: 0.22}); tone(880, t + 0.06, 0.07, {gain: 0.22}); break;
        case 'click': tone(1800, t, 0.03, {gain: 0.2}); break;
      }
    };
    return {play, unlock: ensure};
  })();

  const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch (e) { /* ignore */ } };

  // Keep the screen awake while a game is on the table.
  let wakeLock = null;
  const keepAwake = async () => {
    try {
      if (!wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* refused: fine */ }
  };
  document.addEventListener('visibilitychange', keepAwake);

  // ----------------------------------------------------------- players --
  const panels = [...document.querySelectorAll('.player')].sort((a, b) => a.dataset.p - b.dataset.p);

  const buildPanel = (el, p) => {
    el.innerHTML = `
      <header class="ph">
        <span class="tag">${UNITS[p].tag}</span>
        <span class="unit">${UNITS[p].unit}</span>
        <button class="name" type="button" id="name-${p}" aria-label="Rename player ${p + 1}"></button>
        <span class="status"><b></b><span></span></span>
      </header>
      <div class="hazard"></div>
      <div class="body">
        <button class="zone minus" type="button" id="minus-${p}" aria-label="Player ${p + 1}: lose 1 life">
          <span class="flash"></span><span class="plate"><span>−</span></span>
        </button>
        <button class="zone plus" type="button" id="plus-${p}" aria-label="Player ${p + 1}: gain 1 life">
          <span class="flash"></span><span class="plate"><span>+</span></span>
        </button>
        <div class="readout">
          <div class="label-row">
            <span class="limit"><b>活動限界まで あと</b><small>LIFE</small></span>
            <span class="delta" aria-hidden="true"></span>
          </div>
          <div class="digits"></div>
        </div>
      </div>
      <footer class="gauge">
        <span class="lbl"><b>生命維持</b>LIFE SUPPORT</span>
        <span class="cells">${'<i></i>'.repeat(20)}</span>
        <span class="pct"></span>
      </footer>
      <p class="sr" aria-live="polite"></p>`;

    // Press-and-hold repeats after a short delay.
    const bindZone = (btn, dir) => {
      let holdT = null, repT = null;
      const stop = () => { clearTimeout(holdT); clearInterval(repT); holdT = repT = null; };
      btn.addEventListener('pointerdown', (e) => {
        if (e.button > 0) return;
        Snd.unlock();
        keepAwake();
        change(p, dir, btn);
        stop();
        holdT = setTimeout(() => { repT = setInterval(() => change(p, dir, btn), 110); }, 450);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => btn.addEventListener(ev, stop));
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
      // Keyboard activation arrives as a click with no pointer detail.
      btn.addEventListener('click', (e) => { if (e.detail === 0) change(p, dir, btn); });
    };
    bindZone(el.querySelector('.minus'), -1);
    bindZone(el.querySelector('.plus'), 1);

    el.querySelector('.name').addEventListener('click', () => rename(p));
  };

  const render = (p, {pulse = false} = {}) => {
    const el = panels[p];
    const life = state.life[p];
    const dead = life <= 0;
    const warn = !dead && life <= WARN_AT;
    el.classList.toggle('dead', dead);
    el.classList.toggle('warn', warn);

    el.querySelector('.name').textContent = state.names[p];
    const [jp, en] = dead ? ['活動停止', 'OFFLINE'] : warn ? ['警告', 'WARNING'] : ['正常', 'NORMAL'];
    el.querySelector('.status b').textContent = jp;
    el.querySelector('.status span').textContent = en;

    const digits = el.querySelector('.digits');
    digits.innerHTML = sevenSeg(lifeText(life));
    if (pulse) digits.animate([{opacity: 0.35}, {opacity: 1}], {duration: 110, easing: 'steps(2)'});

    // Gauge: 20 cells scaled to the starting life
    const ratio = Math.max(0, life) / state.start;
    const lit = Math.max(0, Math.min(20, Math.ceil(ratio * 20 - 1e-9)));
    const cell = ratio > 0.5 ? 'var(--green)' : ratio > 0.25 ? 'var(--amber)' : 'var(--red)';
    el.querySelectorAll('.cells i').forEach((c, i) => {
      c.classList.toggle('lit', i < lit);
      c.style.setProperty('--cell', cell);
    });
    el.querySelector('.pct').textContent = `${Math.round(ratio * 100)}%`;

    const pend = pending[p];
    const delta = el.querySelector('.delta');
    if (pend && pend.delta !== 0) {
      delta.textContent = (pend.delta > 0 ? '+' : '−') + Math.abs(pend.delta);
      delta.className = `delta show ${pend.delta > 0 ? 'up' : 'down'}`;
    } else {
      delta.className = 'delta';
    }
  };

  const stamp = (p, kind, jp, en, ms) => {
    const body = panels[p].querySelector('.body');
    body.querySelectorAll(`.stamp.${kind}`).forEach((s) => s.remove());
    const s = document.createElement('div');
    s.className = `stamp ${kind} slam`;
    s.innerHTML = `<b>${jp}</b><small>${en}</small>`;
    body.appendChild(s);
    if (ms) setTimeout(() => s.remove(), ms);
    return s;
  };
  const syncDeadStamp = (p) => {
    const body = panels[p].querySelector('.body');
    const has = body.querySelector('.stamp.dead');
    if (state.life[p] <= 0 && !has) stamp(p, 'dead', '活動停止', 'UNIT OFFLINE');
    if (state.life[p] > 0 && has) has.remove();
  };

  const change = (p, dir, btn) => {
    const before = state.life[p];
    const next = Math.max(-99, Math.min(999, before + dir));
    if (next === before) return;

    if (!pending[p]) {
      pending[p] = {delta: 0, timer: null};
      state.history.push({p, before});
      if (state.history.length > 200) state.history.shift();
    }
    const pend = pending[p];
    pend.delta += dir;
    clearTimeout(pend.timer);
    pend.timer = setTimeout(() => { pending[p] = null; render(p); }, WINDOW_MS);

    state.life[p] = next;
    save();
    render(p, {pulse: true});
    syncDeadStamp(p);
    renderConsole();

    btn?.querySelector('.flash')?.animate([{opacity: 1}, {opacity: 0}], {duration: 220, easing: 'ease-out'});
    buzz(8);
    if (next <= 0 && before > 0) { Snd.play('zero'); buzz(120); }
    else if (next <= WARN_AT && before > WARN_AT) Snd.play('warn');
    else Snd.play(dir > 0 ? 'plus' : 'minus');
    panels[p].querySelector('.sr').textContent = `${state.names[p]}: ${next} life`;
  };

  const rename = (p) => {
    const header = panels[p].querySelector('.ph');
    const btn = header.querySelector('.name');
    const input = document.createElement('input');
    input.className = 'name-input';
    input.id = `name-input-${p}`;
    input.maxLength = 14;
    input.value = state.names[p];
    input.setAttribute('aria-label', `Player ${p + 1} name`);
    btn.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      const v = input.value.trim().toUpperCase();
      if (v) state.names[p] = v;
      save();
      input.replaceWith(btn);
      render(p);
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') { input.value = ''; commit(); }
    });
    input.addEventListener('blur', commit);
  };

  // ----------------------------------------------------------- console --
  const consoleEl = document.getElementById('console');
  let mode = 'main';

  const btn = (id, jp, en, extra = '') => `<button class="cbtn ${extra}" type="button" id="${id}"><b>${jp}</b><small>${en}</small></button>`;

  const renderConsole = () => {
    if (mode !== 'main') return;
    consoleEl.innerHTML =
      `<span class="magi" aria-hidden="true">MAGI</span>` +
      btn('c-first', '先攻', 'FIRST') +
      btn('c-undo', '取消', 'UNDO') +
      btn('c-reset', '初期化', 'RESET') +
      btn('c-sound', '音声', state.sound ? 'SOUND ON' : 'SOUND OFF', state.sound ? 'on' : '');
    const undo = consoleEl.querySelector('#c-undo');
    undo.disabled = state.history.length === 0;
    undo.onclick = undoLast;
    consoleEl.querySelector('#c-reset').onclick = () => { Snd.unlock(); Snd.play('click'); mode = 'reset'; renderReset(); };
    consoleEl.querySelector('#c-first').onclick = () => { Snd.unlock(); runMagi(); };
    consoleEl.querySelector('#c-sound').onclick = () => {
      state.sound = !state.sound;
      save();
      Snd.unlock();
      Snd.play('click');
      renderConsole();
    };
  };

  const renderReset = () => {
    consoleEl.innerHTML =
      `<span class="console-label"><b>初期化</b><small>START LIFE</small></span>` +
      [20, 30, 40].map((n) => btn(`c-start-${n}`, String(n), n === 40 ? 'COMMANDER' : 'LIFE', 'go')).join('') +
      btn('c-cancel', '中止', 'CANCEL');
    [20, 30, 40].forEach((n) => {
      consoleEl.querySelector(`#c-start-${n}`).onclick = () => resetGame(n);
    });
    consoleEl.querySelector('#c-cancel').onclick = () => { mode = 'main'; renderConsole(); };
  };

  const resetGame = (start) => {
    pending.forEach((pd, p) => { if (pd) clearTimeout(pd.timer); pending[p] = null; });
    state = fresh(start, state.names, state.sound);
    save();
    mode = 'main';
    panels.forEach((el) => {
      el.querySelectorAll('.stamp').forEach((s) => s.remove());
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
    [0, 1].forEach((p) => render(p));
    renderConsole();
    Snd.play('reset');
    buzz(30);
  };

  const undoLast = () => {
    const last = state.history.pop();
    if (!last) return;
    const p = last.p;
    if (pending[p]) { clearTimeout(pending[p].timer); pending[p] = null; }
    state.life[p] = last.before;
    save();
    render(p, {pulse: true});
    syncDeadStamp(p);
    renderConsole();
    Snd.unlock();
    Snd.play('undo');
    buzz(15);
  };

  // MAGI deliberation decides who plays first. Majority wins; sometimes one dissents.
  const runMagi = () => {
    if (mode === 'magi') return;
    mode = 'magi';
    const winner = Math.random() < 0.5 ? 0 : 1;
    const dissenter = Math.random() < 0.45 ? Math.floor(Math.random() * 3) : -1;
    const votes = [0, 1, 2].map((i) => (i === dissenter ? 1 - winner : winner));
    const names = ['MELCHIOR·1', 'BALTHASAR·2', 'CASPER·3'];
    consoleEl.innerHTML = names.map((n, i) => `<div class="vote pending" id="v-${i}"><small>${n}</small><b>審議中</b></div>`).join('');
    Snd.play('chatter');
    votes.forEach((v, i) => {
      setTimeout(() => {
        const el = consoleEl.querySelector(`#v-${i}`);
        if (!el) return;
        el.className = `vote p${v}`;
        el.querySelector('b').textContent = UNITS[v].unit;
        Snd.play('approve');
        buzz(10);
      }, 900 + i * 320);
    });
    setTimeout(() => {
      stamp(winner, 'first', '先攻', 'FIRST PLAYER', 2600);
      Snd.play('zero');
      buzz(60);
      consoleEl.innerHTML =
        `<span class="console-label"><b>決議</b><small>RESOLVED</small></span>` +
        `<div class="vote p${winner}"><small>${state.names[winner]}</small><b>先攻 FIRST</b></div>`;
    }, 900 + 3 * 320 + 250);
    setTimeout(() => { mode = 'main'; renderConsole(); }, 900 + 3 * 320 + 2700);
  };

  // --------------------------------------------------------------- boot --
  panels.forEach((el, p) => { buildPanel(el, p); render(p); syncDeadStamp(p); });
  renderConsole();
})();
</script>
</html>
