<title>NERV Life Support</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@900&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
/* Layout: NERV battery panels, each turned to face its player.
   Duel: two panels facing each other across a MAGI console strip.
   Commander: four panels, two per long side of the phone, around a MAGI hub. */
:root {
  /* Single deliberate dark look: a NERV terminal. */
  --bg: #030504;
  --panel: #070a08;
  --grid: rgba(70, 255, 138, 0.05);
  --green: #46ff8a;
  --plate-hi: #7ef06a;
  --plate-lo: #2fb150;
  --orange: #ff8c1a;
  --amber: #ffa91f;
  --amber-off: #1a1004;
  --red: #ff2b1c;
  --ink: #000000;
  --paper: #f4f1ea;
  --scrim: rgba(0, 0, 0, 0.72);
  /* Unit colors: one per seat, so commander damage reads at a glance */
  --unit-0: #46ff8a;
  --unit-1: #ff8c1a;
  --unit-2: #4fd2ff;
  --unit-3: #b48cff;

  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-label: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;

  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--orange);
  font-family: var(--font-label);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* CRT finish over everything */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background:
    radial-gradient(ellipse 80% 75% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.55) 100%),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px);
}

#app {
  position: relative;
  height: 100%;
  display: grid;
  gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px;
  margin-inline: auto;
}
#app.m2 { grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); }
#app.m4 {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
}

/* A seat is a grid cell; the panel inside is sized and turned to face its player. */
.seat { position: relative; min-width: 0; min-height: 0; container-type: size; }
.seat > .player {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 100cqw;
  height: 100cqh;
  translate: -50% -50%;
  rotate: var(--rot, 0deg);
}
.seat[data-rot="90"] > .player, .seat[data-rot="-90"] > .player { width: 100cqh; height: 100cqw; }

/* ---------- player panel ---------- */
.player {
  --frame: var(--orange);
  --digit: var(--amber);
  --accent: var(--unit-0);
  container-type: size;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  border: 2px solid var(--frame);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--panel);
  box-shadow: 0 0 16px color-mix(in srgb, var(--frame) 30%, transparent), inset 0 0 50px var(--ink);
  overflow: hidden;
  animation: power-on 0.45s steps(1) both;
}
.player[data-p="1"] { --accent: var(--unit-1); animation-delay: 0.08s; }
.player[data-p="2"] { --accent: var(--unit-2); animation-delay: 0.16s; }
.player[data-p="3"] { --accent: var(--unit-3); animation-delay: 0.24s; }

.player.warn { --frame: var(--red); --digit: var(--red); }
.player.dead { --frame: var(--red); --digit: var(--red); }

@keyframes power-on {
  0% { opacity: 0; }
  15% { opacity: 1; }
  30% { opacity: 0.15; }
  45% { opacity: 1; }
  60% { opacity: 0.3; }
  75%, 100% { opacity: 1; }
}

/* Floating ID box in the corner of the readout: unit tag and name */
.ident {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: calc(100% - 16px);
  padding: 3px 8px 3px 3px;
  background: color-mix(in srgb, var(--ink) 75%, transparent);
  border: 2px solid var(--orange);
  box-shadow: 0 0 10px color-mix(in srgb, var(--orange) 35%, transparent);
}
.player.cmd-open .ident { display: none; }
.tag {
  flex: none;
  background: var(--accent);
  color: var(--ink);
  font-family: var(--font-jp);
  font-weight: 900;
  font-size: clamp(12px, 4.2cqw, 17px);
  line-height: 1;
  padding: 4px 6px;
}
.name {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 11ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
  background: none;
  border: 0;
  color: var(--orange);
  font: 700 clamp(13px, 4.4cqw, 20px) / 1.1 var(--font-label);
  letter-spacing: 0.08em;
  padding: 2px 0;
  cursor: text;
}
.name-input {
  flex: 0 1 auto;
  width: 11ch;
  min-width: 0;
  background: var(--ink);
  border: 1px solid var(--orange);
  color: var(--orange);
  font: 700 clamp(13px, 4.4cqw, 20px) / 1.1 var(--font-label);
  letter-spacing: 0.08em;
  padding: 2px 6px;
  text-transform: uppercase;
  -webkit-user-select: text;
  user-select: text;
}
.status {
  flex: none;
  display: flex;
  align-items: baseline;
  gap: 5px;
  color: var(--green);
  font-size: clamp(10px, 3.4cqw, 14px);
  font-weight: 700;
  letter-spacing: 0.1em;
}
.status b { font-family: var(--font-jp); font-weight: 900; letter-spacing: 0; }
.player.warn .status, .player.dead .status { color: var(--red); }
.player.warn .status { animation: blink 0.9s steps(1) infinite; }

/* Commander damage / poison switch */
.cmd {
  flex: none;
  display: flex;
  align-items: baseline;
  gap: 4px;
  background: var(--ink);
  border: 2px solid var(--orange);
  color: var(--orange);
  padding: 3px 6px;
  cursor: pointer;
  touch-action: manipulation;
}
.cmd b { font-family: var(--font-jp); font-weight: 900; font-size: clamp(10px, 3.4cqw, 14px); line-height: 1; }
.cmd small { font: 700 clamp(9px, 2.8cqw, 12px) / 1 var(--font-label); letter-spacing: 0.1em; }
.cmd[aria-pressed="true"] { background: var(--orange); color: var(--ink); }
.cmd:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.hazard {
  height: 0;
  /* One seamless 24px tile with two stripes; the scroll moves exactly one tile,
     so the loop never shows a seam. */
  background-color: var(--ink);
  background-image: linear-gradient(45deg, var(--red) 25%, transparent 25% 50%, var(--red) 50% 75%, transparent 75%);
  background-size: 24px 24px;
  transition: height 0.15s;
}
.player.warn .hazard, .player.dead .hazard { height: 8px; animation: hazard-scroll 1s linear infinite; }
@keyframes hazard-scroll { to { background-position: 24px 0; } }

/* ---------- tap zones + readout ---------- */
.body { position: relative; min-height: 0; }

.zone {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  display: flex;
  align-items: center;
}
.zone.minus { left: 0; justify-content: flex-start; padding-left: 8px; }
.zone.plus { right: 0; justify-content: flex-end; padding-right: 8px; }
.zone:focus-visible { outline: 2px solid var(--paper); outline-offset: -4px; }
.flash {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}
.minus .flash { background: linear-gradient(90deg, color-mix(in srgb, var(--red) 35%, transparent), transparent 85%); }
.plus .flash { background: linear-gradient(270deg, color-mix(in srgb, var(--green) 30%, transparent), transparent 85%); }

/* Eva mode-button plate: green plate, black well, orange glyph */
.plate {
  position: relative;
  width: clamp(36px, 12cqw, 62px);
  height: min(62%, 150px);
  padding: 5px;
  background: linear-gradient(180deg, var(--plate-hi), var(--plate-lo));
  box-shadow: 0 0 18px color-mix(in srgb, var(--green) 25%, transparent);
}
.plate span {
  display: grid;
  place-items: center;
  height: 100%;
  background: var(--ink);
  border: 2px solid var(--orange);
  color: var(--orange);
  font: 700 clamp(24px, 9cqw, 44px) / 1 var(--font-label);
  text-shadow: 0 0 8px var(--orange);
}
.minus .plate span { color: var(--red); text-shadow: 0 0 8px var(--red); }

.readout {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  /* top padding clears the ID box */
  padding: 48px clamp(52px, 17cqw, 92px) 8px;
  gap: 4px;
}
.delta {
  position: absolute;
  top: 10px;
  right: 12px;
  font: 700 clamp(20px, 7.5cqw, 36px) / 1 var(--font-label);
  letter-spacing: 0.04em;
  opacity: 0;
  transition: opacity 0.2s;
}
.delta.show { opacity: 1; }
.delta.up { color: var(--green); text-shadow: 0 0 10px var(--green); }
.delta.down { color: var(--red); text-shadow: 0 0 10px var(--red); }

/* The SVG is pinned to its slot so it scales down in short panels instead of
   sizing itself from its width and spilling over the gauge. */
.digits { position: relative; flex: 1; min-height: 0; }
.digits svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.digits .on { fill: var(--digit); }
.digits .off { fill: var(--amber-off); }
.player.warn .digits .on { animation: blink 1.1s steps(1) infinite; }

/* Commander damage and poison marks under the total */
.marks { display: flex; justify-content: center; gap: 6px; min-height: 0; }
.marks:empty { display: none; }
.mark {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--c);
  color: var(--ink);
  font: 700 clamp(11px, 3.6cqw, 15px) / 1 var(--font-label);
  letter-spacing: 0.04em;
  padding: 2px 6px;
}
.mark b { font-family: var(--font-jp); font-weight: 900; font-size: 0.85em; }
.mark.hot { outline: 2px solid var(--red); outline-offset: 1px; }

/* ---------- commander damage grid ---------- */
.dmg {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
  gap: 6px;
  padding: 6px 8px;
  background: var(--panel);
}
.dmg[hidden] { display: none; }
.dcell {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 3px;
  min-height: 0;
  border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
  padding: 4px;
}
.dsrc {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  white-space: nowrap;
}
.dsrc b {
  flex: none;
  background: var(--c);
  color: var(--ink);
  font-family: var(--font-jp);
  font-weight: 900;
  font-size: clamp(10px, 3.2cqw, 14px);
  line-height: 1;
  padding: 2px 5px;
}
.dsrc small {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--c);
  font: 700 clamp(10px, 3cqw, 13px) / 1 var(--font-label);
  letter-spacing: 0.08em;
}
.dctl { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 4px; min-height: 0; }
.dbtn {
  min-height: 0;
  background: var(--ink);
  border: 2px solid var(--orange);
  color: var(--orange);
  font: 700 clamp(18px, 6cqw, 30px) / 1 var(--font-label);
  cursor: pointer;
  touch-action: manipulation;
}
.dbtn.minus { color: var(--green); }
.dbtn.plus { color: var(--red); }
.dbtn:active { background: var(--orange); color: var(--ink); }
.dbtn:focus-visible { outline: 2px solid var(--paper); outline-offset: 1px; }
.dval {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 2px;
  color: var(--amber);
  font: 700 clamp(20px, 8cqw, 40px) / 1 var(--font-label);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 8px color-mix(in srgb, var(--amber) 60%, transparent);
  align-self: center;
}
.dval small { font-size: 0.4em; color: color-mix(in srgb, var(--orange) 70%, transparent); text-shadow: none; }
.dval.hot { color: var(--red); text-shadow: 0 0 8px var(--red); }

/* ---------- gauge ---------- */
.gauge {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 10px 6px 6px;
  border-top: 1px solid color-mix(in srgb, var(--frame) 45%, transparent);
}
.gauge .lbl {
  flex: none;
  font-size: clamp(10px, 3cqw, 13px);
  font-weight: 700;
  letter-spacing: 0.12em;
  white-space: nowrap;
}
.gauge .lbl b { font-family: var(--font-jp); font-weight: 900; letter-spacing: 0; margin-right: 6px; }
.cells { flex: 1; display: flex; gap: 3px; height: 11px; min-width: 0; }
.cells i {
  flex: 1;
  transform: skewX(-20deg);
  background: var(--amber-off);
  border: 1px solid color-mix(in srgb, var(--orange) 25%, transparent);
}
.cells i.lit { background: var(--cell); border-color: var(--cell); box-shadow: 0 0 6px var(--cell); }
.pct {
  flex: none;
  width: 4.2ch;
  text-align: right;
  font-weight: 700;
  font-size: clamp(11px, 3.6cqw, 16px);
  font-variant-numeric: tabular-nums;
}

/* Narrow panels keep only the Japanese in the footer captions */
@container (max-width: 440px) {
  .gauge .lbl span, .status span { display: none; }
}

/* Short panels (four-player seats): the marks stack beside the digits. */
@container (max-height: 260px) {
  .gauge .lbl { display: none; }
  .gauge { padding-block: 4px 5px; }
  /* A slim strip at the top holds the ID box; digits and plates sit below it. */
  .readout { flex-direction: row; align-items: stretch; padding-block: 34px 6px; gap: 8px; }
  .zone { padding-top: 30px; }
  .ident { top: 5px; left: 5px; padding: 2px 6px 2px 2px; }
  .delta { top: 6px; right: 10px; font-size: clamp(16px, 6cqw, 28px); }
  .marks { flex-direction: column; justify-content: flex-end; }
  .mark { justify-content: center; }
  .plate { height: min(50%, 150px); }
}

/* ---------- stamps ---------- */
.stamp {
  position: absolute;
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  z-index: 5;
  pointer-events: none;
  background: var(--stamp, var(--orange));
  color: var(--ink);
  border: 4px solid var(--stamp, var(--orange));
  box-shadow: 0 0 40px var(--stamp, var(--orange));
  padding: 8px 24px 10px;
  text-align: center;
  white-space: nowrap;
  line-height: 1;
}
.stamp b {
  display: block;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(32px, 13cqw, 84px);
  transform: scale(0.88, 1.15);
}
.stamp small {
  display: block;
  margin-top: 8px;
  font: 700 clamp(11px, 3.6cqw, 18px) / 1 var(--font-label);
  letter-spacing: 0.3em;
}
.stamp.dead { --stamp: var(--red); }
.stamp.first { --stamp: var(--green); }
.stamp.slam { animation: slam 0.35s ease-out both; }
@keyframes slam {
  0% { scale: 1.35; opacity: 0; }
  20% { opacity: 1; background: var(--ink); color: var(--stamp, var(--orange)); }
  40% { background: var(--stamp, var(--orange)); color: var(--ink); }
  60% { background: var(--ink); color: var(--stamp, var(--orange)); }
  100% { scale: 1; }
}

/* ---------- console ---------- */
.console {
  display: flex;
  align-items: stretch;
  gap: 6px;
  min-height: 56px;
  animation: power-on 0.45s steps(1) 0.16s both;
}
.magi {
  flex: none;
  display: grid;
  place-items: center;
  width: 56px;
  background: var(--orange);
  color: var(--ink);
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  font: 700 15px / 1 var(--font-label);
  letter-spacing: 0.08em;
}
.cbtn {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: var(--ink);
  border: 2px solid var(--orange);
  color: var(--orange);
  cursor: pointer;
  padding: 4px 2px;
  touch-action: manipulation;
}
.cbtn b { font-family: var(--font-jp); font-weight: 900; font-size: clamp(12px, 3.4vw, 16px); line-height: 1; }
.cbtn small { font: 700 clamp(10px, 2.6vw, 12px) / 1 var(--font-label); letter-spacing: 0.1em; white-space: nowrap; }
.cbtn:active { background: var(--orange); color: var(--ink); }
.cbtn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.cbtn:disabled { opacity: 0.35; cursor: default; }
.cbtn.on { color: var(--green); border-color: var(--green); }
.cbtn.go { background: var(--orange); color: var(--ink); }
.cbtn.go:active { background: var(--ink); color: var(--orange); }

.console-label {
  flex: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  padding-inline: 4px 2px;
  white-space: nowrap;
}
.console-label b { font-family: var(--font-jp); font-weight: 900; font-size: 15px; line-height: 1; }
.console-label small { font: 700 11px / 1 var(--font-label); letter-spacing: 0.12em; }

.vote {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 2px solid var(--orange);
  background: var(--ink);
  color: var(--orange);
  text-align: center;
}
.vote small { font: 700 clamp(9px, 2.5vw, 12px) / 1 var(--font-label); letter-spacing: 0.08em; }
.vote b { font-family: var(--font-jp); font-weight: 900; font-size: clamp(12px, 3.4vw, 15px); line-height: 1; }
.vote.pending b { animation: blink 0.5s steps(1) infinite; }
.vote.resolved { background: var(--c); border-color: var(--c); color: var(--ink); }

/* ---------- four-player hub + menu sheet ---------- */
.hubbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-height: 52px;
  color: color-mix(in srgb, var(--orange) 70%, transparent);
  font: 700 12px / 1 var(--font-label);
  letter-spacing: 0.14em;
  white-space: nowrap;
}
.hubbar .rule { flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--orange) 0 6px, transparent 6px 10px); opacity: 0.5; }
.hub {
  flex: none;
  width: 72px;
  height: 52px;
  border: 0;
  background: var(--orange);
  color: var(--ink);
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  font: 700 16px / 1 var(--font-label);
  letter-spacing: 0.08em;
  cursor: pointer;
  touch-action: manipulation;
}
.hub:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
.hub[aria-expanded="true"] { background: var(--green); }

.sheet {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  background: var(--scrim);
  padding-inline: 12px;
}
.sheet[hidden] { display: none; }
.sheet .console {
  width: min(100%, 460px);
  padding: 10px;
  background: var(--panel);
  border: 2px solid var(--orange);
  box-shadow: 0 0 30px color-mix(in srgb, var(--orange) 35%, transparent);
  min-height: 76px;
}

@keyframes blink { 50% { opacity: 0.25; } }

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 370px) {
  .console > .magi { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<!-- Shared bloom filter for every seven-segment readout -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>

<main id="app"></main>

<script>
(() => {
  // ---------------------------------------------------------------- rules --
  const UNITS = [
    {tag: '零号機', unit: 'UNIT-00'},
    {tag: '初号機', unit: 'UNIT-01'},
    {tag: '弐号機', unit: 'UNIT-02'},
    {tag: '参号機', unit: 'UNIT-03'},
  ];
  const CMDR_LETHAL = 21;
  const POISON_LETHAL = 10;
  const WARN = {life: 5, cmdr: 16, poison: 8};
  const KEY = 'nerv-life-support-v1';

  // Four-player seats run clockwise for turn order: two on each long side,
  // each panel turned to face out toward its player.
  const LAYOUTS = {
    2: [
      {area: '3 / 1', rot: 0},
      {area: '1 / 1', rot: 180},
    ],
    4: [
      {area: '3 / 1', rot: 90},
      {area: '1 / 1', rot: 90},
      {area: '1 / 2', rot: -90},
      {area: '3 / 2', rot: -90},
    ],
  };

  // ---------------------------------------------------------------- state --
  const zeros = (n) => Array.from({length: n}, () => 0);
  const fresh = (players = 2, start = 20, keep = {}) => ({
    players,
    start,
    life: Array.from({length: players}, () => start),
    cmdr: Array.from({length: players}, () => zeros(players)), // cmdr[p][q]: damage dealt to p by q's commander
    poison: zeros(players),
    names: keep.names || ['PLAYER 1', 'PLAYER 2', 'PLAYER 3', 'PLAYER 4'],
    sound: keep.sound ?? true,
    history: [],
  });

  const load = () => {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s || !Array.isArray(s.life)) return fresh();
      const players = s.players === 4 ? 4 : 2;
      const base = fresh(players, s.start || (players === 4 ? 40 : 20), {sound: s.sound});
      const names = [...(s.names || []), ...base.names.slice((s.names || []).length)].slice(0, 4);
      return {
        ...base,
        life: base.life.map((v, i) => (Number.isFinite(s.life[i]) ? s.life[i] : v)),
        cmdr: base.cmdr.map((row, p) => row.map((v, q) => s.cmdr?.[p]?.[q] ?? v)),
        poison: base.poison.map((v, p) => s.poison?.[p] ?? v),
        names,
        history: Array.isArray(s.history) && s.history.every((h) => h.snap) ? s.history : [],
      };
    } catch (e) {
      return fresh();
    }
  };
  let state = load();

  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  };

  const maxCmdr = (p) => Math.max(0, ...state.cmdr[p]);
  const deadReason = (p) =>
    state.life[p] <= 0 ? 'LIFE DEPLETED'
      : maxCmdr(p) >= CMDR_LETHAL ? 'COMMANDER DAMAGE'
        : state.poison[p] >= POISON_LETHAL ? 'POISON'
          : null;
  const level = (p) =>
    deadReason(p) ? 2
      : state.life[p] <= WARN.life || maxCmdr(p) >= WARN.cmdr || state.poison[p] >= WARN.poison ? 1
        : 0;

  // Taps within a short window on one player fold into a single change:
  // one delta readout, one undo step.
  const WINDOW_MS = 1600;
  let pending = [];
  const snapshot = (p) => ({life: state.life[p], cmdr: [...state.cmdr[p]], poison: state.poison[p]});

  // ---------------------------------------------------------- seven-seg --
  const SEGS = {
    '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc',
    '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '',
  };
  const W = 100, H = 190, T = 20, G = 3, SP = 0.3, SKEW = -8;
  const hSeg = (x0, x1, y) => `${x0},${y} ${x0 + T / 2},${y - T / 2} ${x1 - T / 2},${y - T / 2} ${x1},${y} ${x1 - T / 2},${y + T / 2} ${x0 + T / 2},${y + T / 2}`;
  const vSeg = (x, y0, y1) => `${x},${y0} ${x + T / 2},${y0 + T / 2} ${x + T / 2},${y1 - T / 2} ${x},${y1} ${x - T / 2},${y1 - T / 2} ${x - T / 2},${y0 + T / 2}`;
  const M = H / 2;
  const POLY = {
    a: hSeg(T / 2 + G, W - T / 2 - G, T / 2),
    b: vSeg(W - T / 2, T / 2 + G, M - G),
    c: vSeg(W - T / 2, M + G, H - T / 2 - G),
    d: hSeg(T / 2 + G, W - T / 2 - G, H - T / 2),
    e: vSeg(T / 2, M + G, H - T / 2 - G),
    f: vSeg(T / 2, T / 2 + G, M - G),
    g: hSeg(T / 2 + G, W - T / 2 - G, M),
  };
  const sevenSeg = (text) => {
    let on = '', off = '', x = 0;
    for (const ch of text) {
      const lit = SEGS[ch] ?? '';
      for (const k of 'abcdefg') {
        const p = `<polygon transform="translate(${x} 0)" points="${POLY[k]}"/>`;
        if (lit.includes(k)) on += p; else off += p;
      }
      x += W * (1 + SP);
    }
    const total = x - W * SP;
    const pad = Math.tan((-SKEW * Math.PI) / 180) * H;
    return `<svg viewBox="-6 -6 ${total + pad + 12} ${H + 12}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">` +
      `<g transform="skewX(${SKEW}) translate(${pad} 0)"><g class="off">${off}</g><g class="on" filter="url(#bloom)">${on}</g></g></svg>`;
  };
  const lifeText = (n) => {
    const s = String(n);
    return s.length < 2 ? ' ' + s : s;
  };

  // --------------------------------------------------------------- sound --
  const Snd = (() => {
    let ctx = null, master = null;
    const ensure = () => {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.22;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    };
    const tone = (f, t0, dur, {type = 'square', gain = 0.4, to = null, lp = 6000} = {}) => {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      const flt = ctx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.value = lp;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(flt).connect(g).connect(master);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    };
    const NOTES = [1320, 1760, 1980, 2640, 2960, 3520];
    const play = (name) => {
      if (!state.sound) return;
      const c = ensure();
      if (!c) return;
      const t = c.currentTime + 0.005;
      switch (name) {
        case 'plus': tone(2200, t, 0.07, {gain: 0.3}); break;
        case 'minus': tone(1100, t, 0.08, {gain: 0.35}); break;
        case 'warn': for (let i = 0; i < 3; i++) tone(960, t + i * 0.25, 0.17, {gain: 0.35, to: 900, lp: 4000}); break;
        case 'zero':
          tone(160, t, 0.7, {type: 'sine', to: 45, gain: 0.9, lp: 900});
          [[660, 0.28, 0.9], [1822, 0.16, 0.6], [3564, 0.07, 0.35]].forEach(([f, g, d]) => tone(f, t, d, {type: 'sine', gain: g}));
          break;
        case 'reset':
          tone(90, t, 0.14, {type: 'sine', to: 55, gain: 0.6, lp: 500});
          tone(300, t, 0.28, {type: 'sine', to: 2400, gain: 0.25});
          break;
        case 'chatter':
          for (let i = 0; i < 40; i++) if (Math.random() < 0.7) tone(NOTES[Math.floor(Math.random() * NOTES.length)], t + i * 0.03, 0.028, {gain: 0.14});
          break;
        case 'approve': tone(880, t, 0.09, {gain: 0.28}); tone(1320, t + 0.11, 0.19, {gain: 0.28}); break;
        case 'undo': tone(1320, t, 0.05, {gain: 0.22}); tone(880, t + 0.06, 0.07, {gain: 0.22}); break;
        case 'click': tone(1800, t, 0.03, {gain: 0.2}); break;
      }
    };
    return {play, unlock: ensure};
  })();

  const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch (e) { /* ignore */ } };

  // Keep the screen awake while a game is on the table. The lock is requested
  // at load, again whenever the app returns to the foreground (the browser
  // drops it when hidden), and on any tap for browsers that want a gesture.
  let wakeLock = null;
  let wakeRequest = null;
  const keepAwake = () => {
    if (wakeLock || wakeRequest || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    wakeRequest = navigator.wakeLock.request('screen')
      .then((lock) => {
        wakeLock = lock;
        lock.addEventListener('release', () => { wakeLock = null; });
      })
      .catch(() => { /* refused or unsupported: the phone's own timeout applies */ })
      .finally(() => { wakeRequest = null; });
  };
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('pointerdown', keepAwake, {capture: true, passive: true});
  keepAwake();

  // Press and hold repeats after a short delay. Keyboard activation still works.
  const bindHold = (btn, fn) => {
    let holdT = null, repT = null;
    const stop = () => { clearTimeout(holdT); clearInterval(repT); holdT = repT = null; };
    btn.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      Snd.unlock();
      fn();
      stop();
      holdT = setTimeout(() => { repT = setInterval(fn, 110); }, 450);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    btn.addEventListener('click', (e) => { if (e.detail === 0) fn(); });
  };

  // ----------------------------------------------------------- players --
  const app = document.getElementById('app');
  let panels = [];
  let consoleEl = null;
  let sheetEl = null;
  let hubBtn = null;
  let mode = 'main';
  const cmdOpen = new Set();

  const opponents = (p) => Array.from({length: state.players}, (_, q) => q).filter((q) => q !== p);

  const buildPanel = (el, p) => {
    el.innerHTML = `
      <div class="hazard"></div>
      <div class="body">
        <button class="zone minus" type="button" id="minus-${p}" aria-label="Player ${p + 1}: lose 1 life">
          <span class="flash"></span><span class="plate"><span>−</span></span>
        </button>
        <button class="zone plus" type="button" id="plus-${p}" aria-label="Player ${p + 1}: gain 1 life">
          <span class="flash"></span><span class="plate"><span>+</span></span>
        </button>
        <div class="readout">
          <span class="delta" aria-hidden="true"></span>
          <div class="digits"></div>
          <div class="marks"></div>
        </div>
        <div class="ident">
          <span class="tag">${UNITS[p].tag}</span>
          <button class="name" type="button" id="name-${p}" aria-label="Rename player ${p + 1}"></button>
        </div>
        <div class="dmg" hidden>
          ${opponents(p).map((q) => `
            <div class="dcell" style="--c: var(--unit-${q})">
              <div class="dsrc"><b>${UNITS[q].tag}</b><small id="dsrc-${p}-${q}"></small></div>
              <div class="dctl">
                <button class="dbtn minus" type="button" id="cmdr-minus-${p}-${q}" aria-label="Player ${p + 1}: remove 1 commander damage from player ${q + 1}">−</button>
                <span class="dval" id="cmdr-${p}-${q}"></span>
                <button class="dbtn plus" type="button" id="cmdr-plus-${p}-${q}" aria-label="Player ${p + 1}: take 1 commander damage from player ${q + 1}">+</button>
              </div>
            </div>`).join('')}
          <div class="dcell" style="--c: var(--green)">
            <div class="dsrc"><b>毒</b><small>POISON</small></div>
            <div class="dctl">
              <button class="dbtn minus" type="button" id="poison-minus-${p}" aria-label="Player ${p + 1}: remove 1 poison counter">−</button>
              <span class="dval" id="poison-${p}"></span>
              <button class="dbtn plus" type="button" id="poison-plus-${p}" aria-label="Player ${p + 1}: add 1 poison counter">+</button>
            </div>
          </div>
        </div>
      </div>
      <footer class="gauge">
        <button class="cmd" type="button" id="cmd-${p}" aria-pressed="false" aria-label="Player ${p + 1}: commander damage and poison"><b>指揮官</b><small>CMDR</small></button>
        <span class="lbl"><b>生命維持</b><span>LIFE SUPPORT</span></span>
        <span class="cells">${'<i></i>'.repeat(20)}</span>
        <span class="pct"></span>
        <span class="status"><b></b><span></span></span>
      </footer>
      <p class="sr" aria-live="polite"></p>`;

    bindHold(el.querySelector('.minus'), () => changeLife(p, -1, el.querySelector('.zone.minus')));
    bindHold(el.querySelector('.plus'), () => changeLife(p, 1, el.querySelector('.zone.plus')));
    opponents(p).forEach((q) => {
      bindHold(el.querySelector(`#cmdr-minus-${p}-${q}`), () => changeCmdr(p, q, -1));
      bindHold(el.querySelector(`#cmdr-plus-${p}-${q}`), () => changeCmdr(p, q, 1));
    });
    bindHold(el.querySelector(`#poison-minus-${p}`), () => changePoison(p, -1));
    bindHold(el.querySelector(`#poison-plus-${p}`), () => changePoison(p, 1));
    el.querySelector('.name').addEventListener('click', () => rename(p));
    el.querySelector('.cmd').addEventListener('click', () => {
      Snd.unlock();
      Snd.play('click');
      if (cmdOpen.has(p)) cmdOpen.delete(p); else cmdOpen.add(p);
      render(p);
    });
  };

  const render = (p, {pulse = false} = {}) => {
    const el = panels[p];
    const life = state.life[p];
    const lv = level(p);
    el.classList.toggle('dead', lv === 2);
    el.classList.toggle('warn', lv === 1);

    el.querySelector('.name').textContent = state.names[p];
    const [jp, en] = lv === 2 ? ['活動停止', 'OFFLINE'] : lv === 1 ? ['警告', 'WARNING'] : ['正常', 'NORMAL'];
    el.querySelector('.status b').textContent = jp;
    el.querySelector('.status span').textContent = en;

    const digits = el.querySelector('.digits');
    digits.innerHTML = sevenSeg(lifeText(life));
    if (pulse) digits.animate([{opacity: 0.35}, {opacity: 1}], {duration: 110, easing: 'steps(2)'});

    // Commander damage and poison, as marks under the total and in the grid
    const marks = opponents(p)
      .filter((q) => state.cmdr[p][q] > 0)
      .map((q) => `<span class="mark${state.cmdr[p][q] >= WARN.cmdr ? ' hot' : ''}" style="--c: var(--unit-${q})"><b>${UNITS[q].tag[0]}</b>${state.cmdr[p][q]}</span>`);
    if (state.poison[p] > 0) {
      marks.push(`<span class="mark${state.poison[p] >= WARN.poison ? ' hot' : ''}" style="--c: var(--green)"><b>毒</b>${state.poison[p]}</span>`);
    }
    el.querySelector('.marks').innerHTML = marks.join('');
    opponents(p).forEach((q) => {
      const v = state.cmdr[p][q];
      const out = el.querySelector(`#cmdr-${p}-${q}`);
      out.innerHTML = `${v}<small>/${CMDR_LETHAL}</small>`;
      out.classList.toggle('hot', v >= WARN.cmdr);
      el.querySelector(`#dsrc-${p}-${q}`).textContent = state.names[q];
    });
    const pv = el.querySelector(`#poison-${p}`);
    pv.innerHTML = `${state.poison[p]}<small>/${POISON_LETHAL}</small>`;
    pv.classList.toggle('hot', state.poison[p] >= WARN.poison);

    const open = cmdOpen.has(p);
    el.querySelector('.dmg').hidden = !open;
    el.classList.toggle('cmd-open', open);
    el.querySelector('.cmd').setAttribute('aria-pressed', String(open));

    // Gauge: 20 cells scaled to the starting life
    const ratio = Math.max(0, life) / state.start;
    const lit = Math.max(0, Math.min(20, Math.ceil(ratio * 20 - 1e-9)));
    const cell = ratio > 0.5 ? 'var(--green)' : ratio > 0.25 ? 'var(--amber)' : 'var(--red)';
    el.querySelectorAll('.cells i').forEach((c, i) => {
      c.classList.toggle('lit', i < lit);
      c.style.setProperty('--cell', cell);
    });
    el.querySelector('.pct').textContent = `${Math.round(ratio * 100)}%`;

    const pend = pending[p];
    const delta = el.querySelector('.delta');
    if (pend && pend.delta !== 0) {
      delta.textContent = (pend.delta > 0 ? '+' : '−') + Math.abs(pend.delta);
      delta.className = `delta show ${pend.delta > 0 ? 'up' : 'down'}`;
    } else {
      delta.className = 'delta';
    }
    syncDeadStamp(p);
  };

  const stamp = (p, kind, jp, en, ms) => {
    const body = panels[p].querySelector('.body');
    body.querySelectorAll(`.stamp.${kind}`).forEach((s) => s.remove());
    const s = document.createElement('div');
    s.className = `stamp ${kind} slam`;
    s.innerHTML = `<b>${jp}</b><small>${en}</small>`;
    body.appendChild(s);
    if (ms) setTimeout(() => s.remove(), ms);
    return s;
  };
  const syncDeadStamp = (p) => {
    const body = panels[p].querySelector('.body');
    const has = body.querySelector('.stamp.dead');
    const reason = deadReason(p);
    if (reason && !has) stamp(p, 'dead', '活動停止', reason);
    else if (reason && has) has.querySelector('small').textContent = reason;
    else if (!reason && has) has.remove();
  };

  // Every change goes through here: grouping, undo snapshot, sound, render.
  const applyChange = (p, mutate, {lifeDelta = 0, up = false, btn = null} = {}) => {
    const before = level(p);
    if (!pending[p]) {
      pending[p] = {delta: 0, timer: null, entry: {p, snap: snapshot(p)}};
    }
    const pend = pending[p];
    // The group being tapped is always the newest undo step, even if another
    // player's group started after it.
    const at = state.history.indexOf(pend.entry);
    if (at !== -1) state.history.splice(at, 1);
    state.history.push(pend.entry);
    if (state.history.length > 300) state.history.shift();
    pend.delta += lifeDelta;
    clearTimeout(pend.timer);
    pend.timer = setTimeout(() => { pending[p] = null; render(p); }, WINDOW_MS);

    mutate();
    save();
    render(p, {pulse: lifeDelta !== 0});
    renderConsole();

    btn?.querySelector('.flash')?.animate([{opacity: 1}, {opacity: 0}], {duration: 220, easing: 'ease-out'});
    buzz(8);
    const after = level(p);
    if (after === 2 && before < 2) { Snd.play('zero'); buzz(120); }
    else if (after === 1 && before === 0) Snd.play('warn');
    else Snd.play(up ? 'plus' : 'minus');
    panels[p].querySelector('.sr').textContent =
      `${state.names[p]}: ${state.life[p]} life` + (deadReason(p) ? `, out (${deadReason(p).toLowerCase()})` : '');
  };

  const clampLife = (v) => Math.max(-99, Math.min(999, v));

  const changeLife = (p, d, btn) => {
    const next = clampLife(state.life[p] + d);
    if (next === state.life[p]) return;
    applyChange(p, () => { state.life[p] = next; }, {lifeDelta: next - state.life[p], up: d > 0, btn});
  };

  // Commander damage is combat damage too, so it also comes off life.
  const changeCmdr = (p, q, d) => {
    const next = Math.max(0, Math.min(99, state.cmdr[p][q] + d));
    const step = next - state.cmdr[p][q];
    if (!step) return;
    const life = clampLife(state.life[p] - step);
    applyChange(p, () => { state.cmdr[p][q] = next; state.life[p] = life; }, {lifeDelta: life - state.life[p], up: step < 0});
  };

  const changePoison = (p, d) => {
    const next = Math.max(0, Math.min(99, state.poison[p] + d));
    if (next === state.poison[p]) return;
    applyChange(p, () => { state.poison[p] = next; }, {up: d < 0});
  };

  const rename = (p) => {
    const nameBtn = panels[p].querySelector('.ident .name');
    const input = document.createElement('input');
    input.className = 'name-input';
    input.id = `name-input-${p}`;
    input.maxLength = 14;
    input.value = state.names[p];
    input.setAttribute('aria-label', `Player ${p + 1} name`);
    nameBtn.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      const v = input.value.trim().toUpperCase();
      if (v) state.names[p] = v;
      save();
      input.replaceWith(nameBtn);
      // Names also label the other panels' commander damage rows
      panels.forEach((_, i) => render(i));
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') { input.value = ''; commit(); }
    });
    input.addEventListener('blur', commit);
  };

  // ----------------------------------------------------------- console --
  const btn = (id, jp, en, extra = '') => `<button class="cbtn ${extra}" type="button" id="${id}"><b>${jp}</b><small>${en}</small></button>`;

  const setSheet = (open) => {
    if (!sheetEl) return;
    sheetEl.hidden = !open;
    hubBtn.setAttribute('aria-expanded', String(open));
    if (!open && mode !== 'magi') { mode = 'main'; renderConsole(); }
  };

  const renderConsole = () => {
    if (mode !== 'main' || !consoleEl) return;
    consoleEl.innerHTML =
      (state.players === 2 ? `<span class="magi" aria-hidden="true">MAGI</span>` : '') +
      btn('c-first', '先攻', 'FIRST') +
      btn('c-undo', '取消', 'UNDO') +
      btn('c-reset', '初期化', 'RESET') +
      btn('c-sound', '音声', state.sound ? 'SOUND ON' : 'SOUND OFF', state.sound ? 'on' : '');
    const undo = consoleEl.querySelector('#c-undo');
    undo.disabled = state.history.length === 0;
    undo.onclick = undoLast;
    consoleEl.querySelector('#c-reset').onclick = () => { Snd.unlock(); Snd.play('click'); mode = 'reset'; renderReset(); };
    consoleEl.querySelector('#c-first').onclick = () => { Snd.unlock(); runMagi(); };
    consoleEl.querySelector('#c-sound').onclick = () => {
      state.sound = !state.sound;
      save();
      Snd.unlock();
      Snd.play('click');
      renderConsole();
    };
  };

  const RESETS = [
    {id: '2-20', players: 2, start: 20, jp: '20', en: '2P · DUEL'},
    {id: '2-40', players: 2, start: 40, jp: '40', en: '2P · CMDR'},
    {id: '4-40', players: 4, start: 40, jp: '40', en: '4P · CMDR'},
  ];
  const renderReset = () => {
    consoleEl.innerHTML =
      `<span class="console-label"><b>初期化</b><small>NEW GAME</small></span>` +
      RESETS.map((r) => btn(`c-start-${r.id}`, r.jp, r.en, 'go')).join('') +
      btn('c-cancel', '中止', 'CANCEL');
    RESETS.forEach((r) => {
      consoleEl.querySelector(`#c-start-${r.id}`).onclick = () => resetGame(r.players, r.start);
    });
    consoleEl.querySelector('#c-cancel').onclick = () => { mode = 'main'; renderConsole(); };
  };

  const resetGame = (players, start) => {
    pending.forEach((pd) => pd && clearTimeout(pd.timer));
    state = fresh(players, start, {names: state.names, sound: state.sound});
    save();
    mode = 'main';
    cmdOpen.clear();
    buildLayout();
    Snd.play('reset');
    buzz(30);
  };

  const undoLast = () => {
    const last = state.history.pop();
    if (!last) return;
    const p = last.p;
    if (p >= state.players) { renderConsole(); return; }
    if (pending[p]) { clearTimeout(pending[p].timer); pending[p] = null; }
    state.life[p] = last.snap.life;
    state.cmdr[p] = [...last.snap.cmdr];
    state.poison[p] = last.snap.poison;
    save();
    render(p, {pulse: true});
    renderConsole();
    Snd.unlock();
    Snd.play('undo');
    buzz(15);
  };

  // MAGI deliberation decides who plays first. Majority wins; sometimes one dissents.
  const runMagi = () => {
    if (mode === 'magi') return;
    mode = 'magi';
    const n = state.players;
    const winner = Math.floor(Math.random() * n);
    const dissenter = Math.random() < 0.45 ? Math.floor(Math.random() * 3) : -1;
    const others = Array.from({length: n}, (_, i) => i).filter((i) => i !== winner);
    const votes = [0, 1, 2].map((i) => (i === dissenter ? others[Math.floor(Math.random() * others.length)] : winner));
    const names = ['MELCHIOR·1', 'BALTHASAR·2', 'CASPER·3'];
    consoleEl.innerHTML = names.map((nm, i) => `<div class="vote pending" id="v-${i}"><small>${nm}</small><b>審議中</b></div>`).join('');
    Snd.play('chatter');
    votes.forEach((v, i) => {
      setTimeout(() => {
        const el = consoleEl.querySelector(`#v-${i}`);
        if (!el) return;
        el.className = 'vote resolved';
        el.style.setProperty('--c', `var(--unit-${v})`);
        el.querySelector('b').textContent = UNITS[v].unit;
        Snd.play('approve');
        buzz(10);
      }, 900 + i * 320);
    });
    const resolveAt = 900 + 3 * 320 + 250;
    setTimeout(() => {
      stamp(winner, 'first', '先攻', 'FIRST PLAYER', 2600);
      Snd.play('zero');
      buzz(60);
      consoleEl.innerHTML =
        `<span class="console-label"><b>決議</b><small>RESOLVED</small></span>` +
        `<div class="vote resolved" style="--c: var(--unit-${winner})"><small>${state.names[winner]}</small><b>先攻 FIRST</b></div>`;
    }, resolveAt);
    setTimeout(() => {
      mode = 'main';
      if (sheetEl) setSheet(false);
      renderConsole();
    }, resolveAt + (sheetEl ? 900 : 2450));
  };

  // ------------------------------------------------------------ layout --
  const buildLayout = () => {
    const n = state.players;
    app.className = `m${n}`;
    app.innerHTML = '';
    pending = Array.from({length: n}, () => null);
    panels = LAYOUTS[n].map((seat, p) => {
      const s = document.createElement('div');
      s.className = 'seat';
      s.dataset.rot = String(seat.rot);
      s.style.gridArea = seat.area;
      s.style.setProperty('--rot', `${seat.rot}deg`);
      const el = document.createElement('section');
      el.className = 'player';
      el.dataset.p = String(p);
      el.setAttribute('aria-label', `Player ${p + 1}`);
      s.appendChild(el);
      app.appendChild(s);
      buildPanel(el, p);
      return el;
    });

    if (n === 2) {
      consoleEl = document.createElement('nav');
      consoleEl.className = 'console';
      consoleEl.setAttribute('aria-label', 'Game controls');
      consoleEl.style.gridArea = '2 / 1';
      app.appendChild(consoleEl);
      sheetEl = hubBtn = null;
    } else {
      // Four players: a MAGI hub on the center line opens the controls as a sheet.
      const bar = document.createElement('div');
      bar.className = 'hubbar';
      bar.style.gridArea = '2 / 1 / 3 / 3';
      bar.innerHTML = `<span class="rule"></span><span>${n}P · ${state.start}</span>` +
        `<button class="hub" id="hub" type="button" aria-expanded="false" aria-controls="sheet" aria-label="Game controls">MAGI</button>` +
        `<span>指揮官戦</span><span class="rule"></span>`;
      app.appendChild(bar);
      hubBtn = bar.querySelector('#hub');
      sheetEl = document.createElement('div');
      sheetEl.className = 'sheet';
      sheetEl.id = 'sheet';
      sheetEl.hidden = true;
      sheetEl.innerHTML = `<nav class="console" aria-label="Game controls"></nav>`;
      app.appendChild(sheetEl);
      consoleEl = sheetEl.querySelector('.console');
      hubBtn.addEventListener('click', () => {
        Snd.unlock();
        Snd.play('click');
        setSheet(sheetEl.hidden);
      });
      sheetEl.addEventListener('click', (e) => { if (e.target === sheetEl && mode !== 'magi') setSheet(false); });
    }
    panels.forEach((_, p) => render(p));
    renderConsole();
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sheetEl && !sheetEl.hidden && mode !== 'magi') setSheet(false);
  });

  buildLayout();
})();
</script>
